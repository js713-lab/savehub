<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SaveHub — all your saves in one place</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%96%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css?v=6">
</head>
<body>
<header class="top">
  <div class="brand">🔖 <b>SaveHub</b><span class="muted small" id="statline"></span></div>
